<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ff7a3d" />
<title>算算星球 · 家长控制台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #fff9f0; color: #332c26; min-height: 100vh;
    max-width: 720px; margin: 0 auto; padding: 20px 16px 60px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #a08c78; margin-bottom: 18px; }
  .card {
    background: #fffdf9; border: 1px solid #f4e9db; border-radius: 18px;
    padding: 16px; margin-top: 14px; box-shadow: 0 4px 16px rgba(120,80,40,.06);
  }
  .card h2 { font-size: 16px; margin-bottom: 10px; }
  .bindrow { display: flex; gap: 8px; }
  input {
    flex: 1; height: 46px; border: 1px solid #f0e4d5; border-radius: 12px;
    padding: 0 12px; font-size: 16px; background: #fff; color: #332c26; min-width: 0;
  }
  button {
    border: none; cursor: pointer; font-weight: 700; border-radius: 12px;
    background: linear-gradient(135deg, #ff9a5c, #ff7a3d); color: #fff; font-size: 15px;
    padding: 12px 18px;
  }
  button.ghost { background: #fff; color: #6b5a4a; border: 1px solid #f0e4d5; }
  button.danger { background: #fff0ef; color: #ff6b6b; border: 1px solid #ffd4d1; }
  .err { color: #ff6b6b; font-size: 13px; margin-top: 8px; }
  .tip { color: #c0b3a6; font-size: 12px; margin-top: 8px; line-height: 1.6; }
  .devhead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .devname { font-size: 17px; font-weight: 800; flex: 1; }
  .dot { font-size: 13px; color: #c0b3a6; }
  .dot.on { color: #2fbf87; }
  .del { color: #ff6b6b; font-size: 13px; cursor: pointer; padding: 4px; }
  .stats { display: flex; background: #fff4e8; border-radius: 12px; padding: 12px 0; margin-bottom: 12px; }
  .stat { flex: 1; text-align: center; }
  .stat b { display: block; font-size: 20px; color: #ff7a3d; }
  .stat span { font-size: 11px; color: #a08c78; }
  .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  .lbl { width: 76px; font-size: 14px; font-weight: 700; color: #6b5a4a; }
  .pill {
    padding: 7px 14px; background: #fff; border: 1px solid #f0e4d5; border-radius: 100px;
    font-size: 13px; color: #6b5a4a; font-weight: 700; cursor: pointer; user-select: none;
  }
  .pill.active { background: #ff7a3d; border-color: #ff7a3d; color: #fff; }
  .pill.danger { background: #fff0ef; border-color: #ffd4d1; color: #ff6b6b; }
  .gline {
    font-size: 12.5px; line-height: 1.7; color: #a2622c; background: #fff4e8;
    border: 1px solid #f7e6d3; border-radius: 10px; padding: 8px 10px; margin: 2px 0 8px;
  }
  .gline b { color: #7a3f14; }
  .glink { color: #ff7a3d; font-weight: 700; cursor: pointer; margin-left: 8px; text-decoration: underline; }
  .rep { border-top: 1px solid #f8f1e8; padding: 10px 0; }  .rep:first-of-type { border-top: none; }
  .rephead { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
  .rephead .acc { color: #ff6b6b; font-weight: 800; }
  .rephead .acc.good { color: #2fbf87; }
  .wrong { font-size: 13px; color: #8a7663; line-height: 1.7; }
  .okline { font-size: 13px; color: #2fbf87; }
  #toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
    background: rgba(51,44,38,.92); color: #fff; font-size: 14px;
    padding: 10px 20px; border-radius: 100px; opacity: 0; transition: opacity .25s;
    pointer-events: none; max-width: 86vw; text-align: center;
  }
  #toast.show { opacity: 1; }
  .empty { text-align: center; color: #c0b3a6; font-size: 14px; padding: 24px 0; }
</style>
</head>
<body>
  <h1>📡 算算星球 · 家长控制台</h1>
  <div class="sub">绑定孩子设备后，可远程临时解锁 / 立即锁定 / 修改规则 / 留言 / 查看做题报告</div>

  <div class="card">
    <h2>绑定孩子的设备</h2>
    <div class="bindrow">
      <input id="codeIn" maxlength="8" placeholder="输入 8 位配对码（孩子设备：设置 → 家长远程控制）" />
      <button onclick="bind()">绑定</button>
    </div>
    <div class="err" id="bindErr"></div>
    <div class="tip">配对一次永久有效，可绑定多台设备（多个孩子）。本页会记住绑定，下次打开不用重新配对。</div>
  </div>

  <div id="devices"></div>
  <div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script>
  const cloud = WorkBuddyCloud.createWorkBuddyCloud({
    endpoint: 'https://suansuan-parent.app.workbuddy.host',
    publishableKey: 'wbpk_lqghRoJfudpKXkOh3KcMou_3e0crzzG91T1bV6tYf9rUvk2FOHTsWuk'
  })
  const db = cloud.database
  const GRADES = ['全年级', '一年级', '二年级', '三年级', '四年级', '五年级', '六年级']

  const KEY = 'ss_parent_devices'
  const loadBound = () => { try { return JSON.parse(localStorage.getItem(KEY)) || [] } catch (e) { return [] } }
  const saveBound = (a) => localStorage.setItem(KEY, JSON.stringify(a))

  let devices = []

  function toast(t) {
    const el = document.getElementById('toast')
    el.textContent = t; el.classList.add('show')
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2200)
  }

  async function bind() {
    const code = document.getElementById('codeIn').value.trim().toUpperCase()
    document.getElementById('bindErr').textContent = ''
    if (!/^[A-Z0-9]{8}$/.test(code)) { document.getElementById('bindErr').textContent = '配对码是 8 位字母数字'; return }
    const { data, error } = await db.from('devices').select('code, name').eq('code', code).maybeSingle()
    if (error) { document.getElementById('bindErr').textContent = '网络异常，请稍后再试'; return }
    if (!data) { document.getElementById('bindErr').textContent = '没有找到这个配对码，请在孩子设备「设置 → 家长远程控制」里查看'; return }
    const arr = loadBound().filter((d) => d.code !== code)
    arr.unshift({ code, name: data.name || '孩子的设备' })
    saveBound(arr)
    document.getElementById('codeIn').value = ''
    refresh()
  }

  function unbind(code) {
    if (!confirm('确定不再控制这台设备吗？')) return
    saveBound(loadBound().filter((d) => d.code !== code))
    refresh()
  }

  async function send(code, type, payload) {
    const { error } = await db.from('commands').insert({ code, type, payload: payload || {} })
    if (error) { toast('发送失败：网络异常'); return false }
    return true
  }

  async function refresh() {
    const bound = loadBound()
    devices = await Promise.all(bound.map(async (d) => {
      const old = devices.find((x) => x.code === d.code) || {}
      const dev = Object.assign({}, old, d)
      try {
        const { data: info } = await db.from('devices').select('*').eq('code', d.code).maybeSingle()
        if (info) {
          dev.info = info
          dev.online = info.online_at && Date.now() - new Date(info.online_at).getTime() < 30000
        }
      } catch (e) { /* 保留旧数据 */ }
      try {
        const { data: reps } = await db.from('reports').select('*').eq('code', d.code).order('created_at', { ascending: false }).limit(10)
        dev.reports = reps || []
      } catch (e) { dev.reports = dev.reports || [] }
      return dev
    }))
    render()
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  }

  function render() {
    const root = document.getElementById('devices')
    if (!devices.length) {
      root.innerHTML = '<div class="card empty">还没有绑定设备，先输入孩子设备的配对码</div>'
      return
    }
    root.innerHTML = devices.map((d, i) => {
      const st = (d.info && d.info.state) || {}
      const rules = st.rules || d.rules || { on: true, dailyQ: 30, dailyMin: 30, chalQ: 20, chalMin: 30, perQ: 1 }
      const grade = st.grade != null ? st.grade : (d.grade != null ? d.grade : 1)
      const locked = !!st.gradeLocked
      const nextUp = st.gradeNextUp || ''
      const lastSeen = d.info && d.info.online_at
        ? ' · 最后在线 ' + new Date(d.info.online_at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
        : ''
      const reps = (d.reports || []).map((r) => {
        const data = r.data || {}
        const acc = data.total ? Math.round((data.right / data.total) * 100) : 0
        const wrongs = (data.wrong || []).map((w) =>
          `<div class="wrong">✗ ${esc(w.text)} · 答了「${esc(w.your)}」，正确是「${esc(w.answer)}」</div>`).join('')
        return `<div class="rep">
          <div class="rephead"><span>${new Date(r.created_at).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
          <span class="acc ${acc >= 80 ? 'good' : ''}">${acc}% · ${data.right}/${data.total}题</span></div>
          ${wrongs || '<div class="okline">全对，没有错题 🎉</div>'}
        </div>`
      }).join('')
      return `<div class="card">
        <div class="devhead">
          <span class="devname">${esc(d.name || '孩子的设备')}</span>
          <span class="dot ${d.online ? 'on' : ''}">${d.online ? '● 在线' : '○ 离线'}${lastSeen}</span>
          <span class="del" onclick="unbind('${d.code}')">删除</span>
        </div>
        <div class="stats">
          <div class="stat"><b>${st.avail || 0}</b><span>还能用(分)</span></div>
          <div class="stat"><b>${st.dailyDone || 0}/30</b><span>今日任务</span></div>
          <div class="stat"><b>${st.chalDone || 0}</b><span>累计挑战题</span></div>
        </div>
        <div class="row"><span class="lbl">临时解锁</span>
          ${[5, 10, 15, 30, 60].map((m) => `<span class="pill" onclick="doUnlock(${i}, ${m})">${m >= 60 ? m / 60 + '时' : m + '分'}</span>`).join('')}
        </div>
        <div class="row"><span class="lbl">立即锁定</span>
          <span class="pill danger" onclick="doLock(${i})">马上拉回</span>
          <span class="pill" onclick="doPing(${i})">测试连接</span>
        </div>
        <div class="row">
          <input id="msg${i}" placeholder="给孩子发条消息，如：该写作业了" style="flex:1;min-width:160px" />
          <button onclick="doMsg(${i})">发送</button>
        </div>
        <div class="row"><span class="lbl">规则与年级</span>
          <span class="pill ${rules.on ? 'active' : ''}" onclick="setRule(${i}, 'on', ${!rules.on})">${rules.on ? '功能开启中' : '功能已关闭'}</span>
          <span class="pill ${rules.dailyQ === 30 ? 'active' : ''}" onclick="setRule(${i}, 'dailyQ', 30)">每日30题</span>
          <span class="pill ${rules.dailyQ === 20 ? 'active' : ''}" onclick="setRule(${i}, 'dailyQ', 20)">每日20题</span>
          <span class="pill ${rules.chalQ === 20 ? 'active' : ''}" onclick="setRule(${i}, 'chalQ', 20)">挑战20题</span>
          <span class="pill ${rules.chalQ === 30 ? 'active' : ''}" onclick="setRule(${i}, 'chalQ', 30)">挑战30题</span>
        </div>
        <div class="row"><span class="lbl">题目年级</span>
          ${GRADES.map((g, gi) => `<span class="pill ${grade === gi ? 'active' : ''}" onclick="setGrade(${i}, ${gi})">${g}</span>`).join('')}
        </div>
        <div class="gline">
          ${locked
            ? `🔒 已锁定 <b>${GRADES[grade] || ''}</b>：孩子端只能做这个年级的题，点不了其他年级${nextUp ? `　·　${nextUp} 自动升一级` : ''}
               <span class="glink" onclick="allowChild(${i})">允许孩子自选</span>`
            : `未锁定：孩子可在设备上自己换年级 <span class="glink" onclick="setGrade(${i}, ${grade})">锁定当前年级</span>`}
        </div>
        <div class="card" style="margin-top:10px;box-shadow:none;background:#fff">
          <h2>做题报告（最近 ${d.reports ? d.reports.length : 0} 次）</h2>
          ${reps || '<div class="empty">还没有做题报告，孩子做完一组题后会自动同步</div>'}
        </div>
      </div>`
    }).join('')
  }

  async function doUnlock(i, m) {
    if (await send(devices[i].code, 'unlock', { minutes: m })) toast(`已下发：临时解锁 ${m >= 60 ? m / 60 + ' 小时' : m + ' 分钟'}`)
  }
  async function doLock(i) {
    if (await send(devices[i].code, 'lock_now', {})) toast('已下发：立即锁定并拉回')
  }
  async function doPing(i) {
    if (await send(devices[i].code, 'ping', {})) toast('已发送测试，几秒后设备状态会刷新')
  }
  async function doMsg(i) {
    const el = document.getElementById('msg' + i)
    const text = (el.value || '').trim()
    if (!text) return toast('先写点什么吧')
    if (await send(devices[i].code, 'msg', { text })) { el.value = ''; toast('消息已发送') }
  }
  async function setRule(i, key, value) {
    const d = devices[i]
    const st = (d.info && d.info.state) || {}
    const rules = Object.assign({ on: true, dailyQ: 30, dailyMin: 30, chalQ: 20, chalMin: 30, perQ: 1 }, st.rules || d.rules || {}, { [key]: value })
    d.rules = rules
    if (await send(d.code, 'set_rules', { rules })) toast('规则已更新，孩子设备几秒内生效')
  }
  async function setGrade(i, g) {
    devices[i].grade = g
    if (await send(devices[i].code, 'set_grade', { grade: g, lock: true })) {
      toast('年级已设定并锁定，孩子端几秒内生效')
      setTimeout(refresh, 1500)
    }
  }
  async function allowChild(i) {
    const g = devices[i].grade != null ? devices[i].grade : 1
    if (await send(devices[i].code, 'set_grade', { grade: g, lock: false })) {
      toast('已允许孩子在设备上自选年级')
      setTimeout(refresh, 1500)
    }
  }

  // URL 带配对码（扫孩子设备二维码进来）：自动填入
  const urlCode = new URLSearchParams(location.search).get('c')
  if (urlCode) document.getElementById('codeIn').value = String(urlCode).toUpperCase().slice(0, 8)

  refresh()
  setInterval(refresh, 10000)
</script>
</body>
</html>
