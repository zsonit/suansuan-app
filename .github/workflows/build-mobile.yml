name: Build Android & iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install deps & build H5
        run: |
          npm ci
          H5_BASE=./ npm run build:h5
      - name: Sync web assets to Android
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suansuan-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps & build H5
        run: |
          npm ci
          H5_BASE=./ npm run build:h5
      - name: Sync web assets to iOS
        run: npx cap sync ios
      - name: Resolve SPM packages
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -resolvePackageDependencies
      - name: Build unsigned .app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""
      - name: Package unsigned ipa
        run: |
          mkdir -p ios/Payload
          cp -r "ios/build/Build/Products/Debug-iphoneos/App.app" ios/Payload/
          cd ios && zip -qry ../suansuan-ios-unsigned.ipa Payload
      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: suansuan-ios-unsigned-ipa
          path: suansuan-ios-unsigned.ipa
